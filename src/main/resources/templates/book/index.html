<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common :: meta_header('書籍一覧',~{::link},~{::script})}">
  <title th:text="${title} + ' | MTLibrary'"></title>
  <link rel="stylesheet" th:href="@{/css/book/index.css}" />
  <script type="text/javascript" th:src="@{/js/book/index.js}"></script>
</head>
<body>
  <div class="contents">
    <!-- サイドバー -->
    <div th:replace="~{common :: main_sidebar}"></div>
 
    <!-- メインコンテンツ -->
    <div class="main_contents">
      <div th:replace="~{common :: header}"></div>
      <div class="inner_contens">
        <div class="page_title">書籍一覧</div>
 
        <!-- 表とボタンを囲むラッパー -->
        <div class="book_list_wrapper" style="position: relative; width: 80%; margin: 0 auto; margin-top: 30px;">
          <!-- 書籍登録ボタン -->
          <form th:action="@{/book/add}" method="get">
          <button onclick="location.href='/books/new'"
                  style="position: absolute; right: 0; top: -40px;">
            書籍登録
          </button>
          </form>
 
          <!-- 書籍一覧表 -->
          <table class="book_table" border="1" style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr>
                <th>書籍名</th>
                <th>ISBN</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="book : ${bookMstList}">
                <td th:text="${book.title}"></td>
                <td th:text="${book.isbn}"></td>
              </tr>
            </tbody>
          </table>
        </div>
 
      </div>
    </div>
  </div>
 
  <!-- フッター -->
  <div th:replace="~{common :: footer}"></div>
</body>
</html>
