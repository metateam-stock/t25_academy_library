<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common :: meta_header('書籍一覧',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/book/index.css}" />
    <script type="text/javascript" th:src="@{/js/book/index.js}"></script>
</head>
<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">書籍一覧</div>

                <div th:if="${successMessage}" class="success_msg">
                    <p th:text="${successMessage}"></p>
                </div>
                


                    <a th:href="@{/book/add}"> <button>書籍登録</button></a>
                <table class ="books_table">
                    <thead>
                        <tr>
                            <th>書籍名</th>
                            <th>ISBN</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${bookMstList}">
                            <td>
                                
                                <!-- 編集ボタン -->
                                <a th:href="@{/book/edit/{id}(id=${book.id})}" class="edit_btn" title="編集">
                                    <img th:src="@{/images/icons/edit.png}" alt="編集" style="width:20px; height:20px; margin-left:8px;" />
                                </a>
                            
                                <!-- 削除ボタン -->
                                <a th:href="@{'/book/delete'}" title="削除" onclick="return confirm('本当に削除しますか？')">
                                    <img th:src="@{/images/icons/trash.png}" alt="削除" style="width:20px; height:20px; margin-left:4px;" />
                                </a>

                                <span th:text="${book.title}">書籍タイトル</span>
                            </td>
                            
                            <td th:text="${book.isbn}">ISBNコード</td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>
