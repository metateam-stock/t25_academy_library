<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common :: meta_header('書籍一覧',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/book/index.css}" />
    <script type="text/javascript" th:src="@{/js/book/index.js}"></script>
</head>
<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">書籍一覧</div>
            </div>
            <style>
                .btn_block {
                  text-align: right;
                  padding-right: 50px; /* 右側に90pxの余白を追加 */
                  margin-top: 0.005px;/*上側の余白*/
                }
              </style>
 
            <div class="btn_block">
                <div style = "text-align: right;">
                    <form th:action="@{/book/add}" method="get"style="display: inline-block;">
                <input type="submit" value="📚書籍登録" style="padding: 12px 24px; font-size: 16px;
                background-color: #87f4b4fa;border: 1px solid #87f4b4fa;">
                </form>

                <table class="book_table" border="1" style="margin: 0 auto;">
                    <thead>
                        <tr>
                            <th>書籍名</th>
                            <th>ISBN</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${bookMstList}">
                            <td th:text="${book.title}"></td>
                            <td th:text="${book.isbn}"></td>
                        </tr>
                    </tbody>
                    <style>
                        .book_table td {
                            text-align: left; /* 書籍名を左詰め */
                        }
                    </style>
                    <style>
                        .book_table th, .book_table td {
                            text-align: left; /* 書籍名とISBNを左詰め */
                        }
                    </style>
                </table>
                
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>
