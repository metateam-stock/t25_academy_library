<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common :: meta_header('書籍登録',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/book/add.css}" />
    <script type="text/javascript" th:src="@{/js/book/add.js}"></script>
</head>

<body>
    <!-- 存在エラーメッセージの表示 -->

        <div class="popup-window">
            <span th:text="${error}"></span>
            <label for="popup" class="popup-close"></label>
        </div>
    </div> -->
    <!-- 変更エラーメッセージの表示 -->
     <div class="popup-overlay" th:if="${noChange}">
        <div class="popup-window">
            <span th:text="${noChange}"></span>
            <button class="popup-close">×</button>
        </div> 
    <!-- <input type="checkbox" id="popup-toggle" class="popup-toggle" th:checked="${noChange != null}">
    <label for="popup-toggle" class="popup-close">×</label>
    <div class="popup-overlay">
        <div class="popup-window">
            <span th:text="${noChange}">エラーメッセージがここに表示されます</span>
        </div>
    </div></input> -->

    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">書籍変更</div>
                <div class="page_contents">

                    <!-- <form id="book_edit_form" th:object="${bookMstDto}" th:action="@{/book/edit/{id}}" method="post"></form> -->
                    <form id="book_edit_form" th:object="${bookMstDto}" th:action="@{/book/edit}" method="post">
                        <span class="text red" style="color: red"><span>*</span>は必須項目です</span>
                        <p><span style="color: red">*</span>書籍名<br>
                            <input type="text" size="100" name="title" th:field="*{title}"></input>

                        <div class="error_msg" th:if="${errTitle}">
                            <div th:each="msg : ${errTitle}">
                                <p th:text="${msg}" style="color: red"></p>
                            </div>
                        </div>
                        </p>
                        <p><span style="color: red">*</span>ISBN<br>
                            <input type="text" size="100" name="isbn" th:field="*{isbn}"></input>
                        <div class="error_msg" th:if="${errIsbn}">
                            <div th:each="msg : ${errIsbn}">
                                <p th:text="${msg}" style="color: red"></p>
                            </div>
                        </div>
                        <input type="hidden" name="id" th:field="*{id}"></input>
                        <div><button type="submit">変更</button></div>
                    </form>

                    <span>
                        <a th:href="@{/book/index}" class="link">← 一覧へ戻る</a>
                    </span>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>
